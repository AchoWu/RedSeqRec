data:
  # ===================================================================
  # 64-d EXPLICIT multi-interest training (stage 1: adapter warmup)
  #
  # Differs from config/train_64d_stage1.yaml (the kmeans variant) in
  # ONE material way: category_assignment_path is set. That flag flips
  # the pipeline into explicit-token-assignment mode end-to-end:
  #
  #   * REDRecV0AlignedDataset._select_window drops any pos/seq item
  #     whose cid_to_token[cid] == -1 (unlabeled, ~0.33% of pool).
  #   * REDRecV0AlignedDataset._build_batch emits a new
  #     `precomputed_target_token_ids` [B, T] int64 tensor: which of the
  #     Q=3 user interest tokens each target pos should be matched to.
  #     Token IDs come from config/category_to_token.json:
  #       token_0 = 娱乐观赏 (48% of pool)
  #       token_1 = 生活起居 (32% of pool)
  #       token_2 = 社会知识 (20% of pool)
  #   * redrec.py::forward_precomputed_embedding takes the new tensor
  #     and does output_embs.gather(1, ids) to produce matched targets
  #     -- skipping the kmeans + linear_sum_assignment CPU roundtrip.
  #
  # If category_assignment_path is unset (or the referenced .npy is
  # missing), everything falls back to the kmeans path used by
  # config/train_64d_stage1.yaml. The two yamls are otherwise
  # interchangeable.
  # ===================================================================
  dataset_type: v0_aligned

  v0_train_jsonl: /group/40094/jingweidong/user_sequential_feature_recall/qbfeed_action_flow/user_latest/train.jsonl
  v0_eval_jsonl:  /group/40094/jingweidong/user_sequential_feature_recall/qbfeed_action_flow/user_latest/test.jsonl
  v0_embedding_dir: /group/40094/jingweidong/user_sequential_feature_recall/qbfeed_action_flow/preprocessed64d

  # ===== Explicit multi-interest lookup =====
  # int8 array shape=[num_items] with values 0/1/2 (0-based token idx)
  # or -1 (unlabeled). Produced by build_cid_to_token.py from
  # config/category_to_token.json + cids_union_subject.csv.
  # Placed alongside cids.npy so it survives memmap-pool moves; the
  # dataloader memmap-opens it (mode='r') so multiple workers/ranks
  # share a single page-cache copy.
  category_assignment_path: /group/40094/jingweidong/user_sequential_feature_recall/qbfeed_action_flow/preprocessed64d/cid_to_token.npy

  # ---- per-user sample selection ----
  seq_label: seq
  positive_label: pos
  hard_neg_label: []
  max_hard_neg: 0
  # min_history_len=20 mirrors RedSeqRecV0Simple/config/v0_3emb_64d.yaml.
  # This is checked BEFORE the target-tail carve-out, matching V0's
  # build_eval_set_latest gate.
  min_history_len: 20
  # Aligned with train_64d_stage2.yaml (max_seq_len=100) so the
  # stage1 -> stage2 recall curve is continuous end-to-end. See the
  # kmeans stage1 yaml for the full rationale.
  max_seq_len: 100
  sample_lastn: true
  train_target_strategy: random
  loop_forever: true
  shuffle_buffer_size: 1024

  # ---- multi-interest target tail (still 10 positives per user) ----
  # Structurally identical to the kmeans variant; the difference is at
  # the MATCHING step in the model, not at the target-picking step in
  # the dataloader.
  multi_interest:
    enabled: true
    target_tail_len: 10
    # KMeans hyperparams accepted for forward-compat but not consumed
    # when explicit mode is on. Kept here so the two yamls diff cleanly.
    kmeans_k: 3
    kmeans_n_iter: 5
    kmeans_n_init: 1

  eval_users: 50000
  eval_target_strategy: all
  eval_seed: 42

  # ---- batch / negatives ----
  # bs=4 / accum=8 -> effective bs/rank=32. Same cuBLAS Lt SIGFPE
  # constraint as all 64-d runs; see start_train_64d_stage1.sh header.
  train_batch_size: 4
  neg_samples_per_gpu: 400
  neg_pool_size_per_gpu: 1000000

  train_num_workers: 8
  precomputed_stats_interval: 10000

  precomputed_64d_pos_n: 10

  # ---- legacy fields kept so existing code paths don't crash ----
  train_noteinfo_kv: { ip: '', port: '', prefix: '', ex: 1 }
  engage_lastn_kv: { ip: '', port: '', prefix: '', ex: 1 }
  click_lastn_data_root: ''
  item_prompt: '总结:\n'
  max_text_len: 230
  max_topic_nums: 8
  max_input_token_len: 300
  add_item_hour_embed: false
  lastn_max_engage_note_num: 0
  lastn_max_click_note_num_homefeed: 96
  lastn_max_click_note_num_ads: 0

model:
  model_name: REDRec
  item_pretrain_dir: /group/40094/jingweidong/user_sequential_feature_recall/RedSeqRec/eval/pre_trained_ckpts/Qwen2.5-1.5B
  item_llm_init: false
  user_pretrain_dir: /group/40094/jingweidong/user_sequential_feature_recall/RedSeqRec/eval/pre_trained_ckpts/Qwen2.5-1.5B
  user_llm_init: true
  # === 64-d topology (unchanged from the kmeans variant) ===
  precomputed_input_dim: 64
  user_output_dim: 64
  user_final_dim: 64
  use_ft_flash_attn: true
  use_lora: false
  gradient_checkpointing: false

  engage_action_n: 5
  add_item_action_embed: false
  add_hour_embed: false
  add_position_embed: false
  learnable_interest_query: false

  AE_compress_dim: -1
  AE_compress_decay_rate: 0.9995

  predict_action: false

  # 3 user queries; when explicit mode is on, the token_i queries are
  # driven directly by category_to_token.json's token_1/2/3 groups.
  query_nums: 3
  window_pos: 3

# Stage 1: freeze entire user_llm trunk.
freeze_prefix:
  - 'user_llm'

training:
  target: homefeed
  optim_args:
    learning_rate: 1.0e-3
    weight_decay: 0.01

  scheduler_args:
    type: cosine
    warmup_steps: 2000

  eval_step: 1000
  eval_interval: 1000
  eval_user_batch: 128
  eval_score_chunk: 512
  save_step: 1000
  ckpt_keep_top_k: 5

  clip_grad_norm: 1.0
  accumulation_steps: 1
  freeze_item: false
  total_step: 100000
  strategy: deepspeed
  stage: 2
  gradient_checkpointing: false
  load_pretrained_model: ''

saver:
  output_dir: /apdcephfs_gy4/share_303218624/jingweidong/output_xhs
  v0_style: true
  checkpoint_dir: /apdcephfs_gy4/share_303218624/jingweidong/output_xhs
  log_dir: /apdcephfs_gy4/share_303218624/jingweidong/output_xhs
  # Distinct run name so this explicit run lands under its own timestamped
  # subdir and doesn't collide with the kmeans stage-1 run tree.
  saved_model_name: redrec_64d_explicit_stage1

eval:
  target: homefeed
  model_path: /apdcephfs_gy4/share_303218624/jingweidong/output_xhs/redrec_64d_explicit_stage1_<RUN_TS>/checkpoint-100001/
  note_eval:
    lastn_note_info_path: ''
    basepool_note_info_path: ''
  user_eval:
    user_lastn_path: eval/user_lastn_my.json
    max_lastn_len: 200
    user_eval_batch_size: 16

show_progress: true
precision: bf16-mixed
loss: nce
nce_thres: 0.8

val_only: false
online_compute_embedding: false
seed: 1112
update_interval: 10
reproducibility: false
